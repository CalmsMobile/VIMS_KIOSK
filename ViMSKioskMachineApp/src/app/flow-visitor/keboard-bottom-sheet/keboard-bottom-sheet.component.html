<div style="text-align: center">
  <input
    #inputId
    id="inputId"
    (input)="onInputChange($event)"
    class="input"
    value="{{ value }}"
    placeholder="{{ data.field_caption }}"
  />
  <span id="error" style="font-size: 12pt;
  display: flex;
  color: red;"></span>
  <div class="simple-keyboard" ></div>
</div>
